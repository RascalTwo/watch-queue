# CI on GitHub, CD on the NAS.
#   every push / PR  -> check, build the image, and run it as locked down as the NAS does
#   push to main     -> also publish it to ghcr.io, then send a signed "new version" notice to
#                       https://hooks.rascaltwo.com, which makes the NAS pull + redeploy.
# GitHub never gets access to the home network: the notice only raises a flag; the NAS
# decides what to do and only ever pulls this repo's own image.
name: build & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/rascaltwo/watch-queue

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          provenance: false
          sbom: false
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: watch-queue:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Nothing is published unless the image starts, reports this commit and can make an
      # invite with a read-only root, no capabilities and the NAS's user.
      - name: Run the image as the NAS does
        run: |
          set -euo pipefail
          docker run -d --name app --read-only --user 568:568 --cap-drop ALL \
            --tmpfs /tmp --tmpfs /data:uid=568,gid=568 -p 8080:8080 watch-queue:test
          trap 'docker logs app' EXIT
          for _ in $(seq 1 30); do
            live=$(curl -fsS --max-time 3 http://127.0.0.1:8080/api/health | jq -r .commit || true)
            [ "$live" = "$GITHUB_SHA" ] && break
            sleep 1
          done
          [ "$live" = "$GITHUB_SHA" ]
          curl -fsS http://127.0.0.1:8080/ | grep 'Watch Queue' > /dev/null
          curl -fsS http://127.0.0.1:8080/app.js | grep 'invite only' > /dev/null
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/list)" = 401 ]
          docker exec app node src/admin.ts invite test | grep '#invite=' > /dev/null

      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        name: Publish
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # One plain image per build: provenance/SBOM children show up in ghcr as "untagged"
          # versions that the retention cleanup must never delete.
          provenance: false
          sbom: false
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha

  notify-nas:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Signed deploy notice
        env:
          SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          body=$(printf '{"app":"watch-queue","image":"%s","digest":"%s","sha":"%s","ts":%s}' \
            "$IMAGE" "$DIGEST" "$GITHUB_SHA" "$(date +%s)")
          sig="sha256=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$SECRET" -r | cut -d' ' -f1)"
          curl -fsS --max-time 20 -X POST https://hooks.rascaltwo.com/deploy \
            -H "Content-Type: application/json" \
            -H "X-Signature-256: $sig" \
            --data "$body"
